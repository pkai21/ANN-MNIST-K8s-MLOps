name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Kubernetes

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: [self-hosted, linux, x64]

    env:
      NAMESPACE: ann-mnist
      DEPLOYMENT: ann-mnist-api
      CONTAINER: ann-mnist-api
      IMAGE: ghcr.io/pkai21/ann-mnist-k8s-mlops:sha-${{ github.event.workflow_run.head_sha }}

    steps:

      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update Docker image
        run: |
          kubectl set image \
            deployment/${DEPLOYMENT} \
            ${CONTAINER}=${IMAGE} \
            -n ${NAMESPACE}

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/${DEPLOYMENT} \
            -n ${NAMESPACE} \
            --timeout=180s

      - name: Verify deployment
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment ${DEPLOYMENT} -n ${NAMESPACE}

          echo ""
          echo "===== PODS ====="
          kubectl get pods -n ${NAMESPACE} -o wide

          echo ""
          echo "===== SERVICE ====="
          kubectl get service -n ${NAMESPACE}

      - name: Check deployed image
        run: |
          kubectl get deployment ${DEPLOYMENT} \
            -n ${NAMESPACE} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      - name: Health check
        run: |
          echo "Waiting for API..."

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:30080/health; then
              echo ""
              echo "API is healthy!"
              exit 0
            fi

            echo "API not ready yet..."
            sleep 3
          done

          echo "Health check failed."

          kubectl get pods -n ${NAMESPACE} -o wide
          kubectl describe pods -n ${NAMESPACE}
          kubectl logs \
            -n ${NAMESPACE} \
            -l app=ann-mnist-api \
            --tail=100 || true

          exit 1