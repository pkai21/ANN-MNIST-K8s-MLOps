name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Kubernetes

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    # ==============================
    # APPROVAL GATE
    # ==============================
    environment:
      name: production

    runs-on: [self-hosted, linux, x64]

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    env:
      NAMESPACE: ann-mnist
      DEPLOYMENT: ann-mnist-api
      CONTAINER: ann-mnist-api
      IMAGE: ghcr.io/pkai21/ann-mnist-k8s-mlops:sha-${{ github.event.workflow_run.head_sha }}

    steps:

      # ==============================
      # CHECKOUT
      # ==============================

      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ==============================
      # KUBERNETES
      # ==============================

      - name: Check Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==============================
      # UPDATE IMAGE
      # ==============================

      - name: Update Docker image
        run: |
          kubectl set image \
            deployment/${DEPLOYMENT} \
            ${CONTAINER}=${IMAGE} \
            -n ${NAMESPACE}

      # ==============================
      # ROLLOUT
      # ==============================

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/${DEPLOYMENT} \
            -n ${NAMESPACE} \
            --timeout=180s

      # ==============================
      # VERIFY
      # ==============================

      - name: Verify deployment
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment ${DEPLOYMENT} -n ${NAMESPACE}

          echo ""
          echo "===== PODS ====="
          kubectl get pods -n ${NAMESPACE} -o wide

          echo ""
          echo "===== SERVICE ====="
          kubectl get service -n ${NAMESPACE}

      - name: Check deployed image
        run: |
          kubectl get deployment ${DEPLOYMENT} \
            -n ${NAMESPACE} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      # ==============================
      # HEALTH CHECK
      # ==============================

      - name: Health check
        run: |
          echo "Waiting for API..."

          for i in {1..30}; do

            kubectl delete pod health-check \
              -n ${NAMESPACE} \
              --ignore-not-found=true

            kubectl run health-check \
              -n ${NAMESPACE} \
              --restart=Never \
              --image=curlimages/curl \
              --command -- \
              curl --fail --silent --show-error \
              http://${DEPLOYMENT}:8000/health

            if kubectl wait \
              --for=jsonpath='{.status.phase}'=Succeeded \
              pod/health-check \
              -n ${NAMESPACE} \
              --timeout=10s; then

              echo ""
              echo "API is healthy!"

              kubectl logs health-check -n ${NAMESPACE}

              kubectl delete pod health-check \
                -n ${NAMESPACE} \
                --ignore-not-found=true

              exit 0
            fi

            echo "API not ready yet..."

            kubectl logs health-check \
              -n ${NAMESPACE} || true

            kubectl delete pod health-check \
              -n ${NAMESPACE} \
              --ignore-not-found=true

            sleep 3
          done

          echo "Health check failed."

          kubectl get pods -n ${NAMESPACE} -o wide
          kubectl get service -n ${NAMESPACE}

          kubectl describe pods -n ${NAMESPACE}

          kubectl logs \
            -n ${NAMESPACE} \
            -l app=ann-mnist-api \
            --tail=100 || true

          exit 1